<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso Restringido - Activos AVANT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white d-flex align-items-center justify-content-center" style="min-height: 100vh;">

<div class="card bg-secondary text-white p-4 shadow-lg border-danger text-center" style="max-width: 400px; width: 100%;">
    <h3 class="fw-bold text-warning mb-2">🔒 Activos Fijos AVANT</h3>
    <p class="text-light mb-4">Ingresa la clave de autorización para acceder al módulo de Renta y Control de Equipos.</p>
    
    <form method="POST" action="/inventarios/activos">
        <input type="password" name="clave" class="form-control form-control-lg text-center fw-bold border-warning mb-3" placeholder="******" required autofocus>
        <button type="submit" class="btn btn-warning btn-lg w-100 fw-bold shadow-sm">INGRESAR</button>
    </form>

    {% if error %}
    <div class="alert alert-danger mt-3 mb-0 fw-bold">{{ error }}</div>
    {% endif %}
</div>

</body>
</html>
